[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-bot"
version = "1.0.0"
description = "Quick-Flip Polymarket Trading Bot"
authors = [{name = "Polymarket Bot", email = "bot@polymarket.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0", 
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.19.0",
]

[project.scripts]
polymarket-bot = "main:main"

[tool.setuptools]
packages = ["polymarket_bot", "polymarket_bot.core", "polymarket_bot.data", "polymarket_bot.strategies", "polymarket_bot.execution", "polymarket_bot.risk", "polymarket_bot.monitoring", "polymarket_bot.utils", "polymarket_bot.backtest"]

[tool.setuptools.package-dir]
polymarket_bot = "."